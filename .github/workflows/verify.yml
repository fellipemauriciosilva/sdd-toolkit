name: verify

# Verificação, não publicação. O pacote público é produzido apenas por
# scripts/sdd_release.py sob revisão do mantenedor (docs/RELEASE.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 é o piso declarado em README.md e docs/QUICKSTART.md.
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile runtime artifacts
        run: python scripts/sdd_compile.py --runtime all

      - name: Assert dist/ is in sync with agents/ and templates/
        run: git diff --exit-code -- dist/

      - name: Rebuild build manifest
        run: python scripts/build_inventory.py --write dist/build-manifest.json

      - name: Assert build manifest is in sync
        run: git diff --exit-code -- dist/build-manifest.json

      - name: Lint agent contracts
        run: python scripts/sdd_lint.py --json

      - name: Validate public content
        run: python scripts/public_content_check.py

      - name: Run test suite
        run: python -m unittest discover -s tests

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate Developer Certificate of Origin sign-off
        env:
          # Via env para não interpolar contexto diretamente no shell.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_dco.py --range "$BASE_SHA..$HEAD_SHA"
