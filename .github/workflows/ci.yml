name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and public content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python -m pip install -r requirements-dev.txt
      - if: github.event_name == 'pull_request'
        run: python scripts/check_dco.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Validate installer and CLI arguments without mutation
        shell: bash
        run: |
          bash -n install.sh
          if bash install.sh --runtime=invalid --dry-run; then exit 1; fi
          if python scripts/sdd.py runtime detect --runtime invalid --mode quick --json; then exit 1; fi
      - name: Rebuild generated assets
        shell: bash
        run: |
          python scripts/sdd_compile.py --runtime all
          python scripts/build_inventory.py --write dist/build-manifest.json > /dev/null
          git diff --exit-code -- dist
          bash scripts/validate-public-content.sh

  test:
    name: Tests - ${{ matrix.os }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
