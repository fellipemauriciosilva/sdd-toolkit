name: Bug report
description: Reportar um comportamento incorreto ou regressão
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Versão
      description: Versão do toolkit, agente ou artefato afetado.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime e sistema operacional
      placeholder: Claude Code / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reprodução
      description: Comandos e passos mínimos, sem dados sensíveis.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
    validations:
      required: true
