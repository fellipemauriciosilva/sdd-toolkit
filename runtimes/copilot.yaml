# SDD Kit — Runtime Adapter: GitHub Copilot
# Usado pelo compilador v3.0 para gerar agentes no formato Copilot.
#
# O compilador lê cada agents/*.md, injeta este frontmatter e filtra
# as seções @copilot + @all. O resultado vai para dist/copilot/.

target: copilot
adapter_schema_version: 1
min_version: "unknown"
output_filename: "{name}.agent.md"
output_dir: "dist/copilot"
renderer: "markdown"
section: "@copilot"
user_agent_dir: ".copilot/agents"
skill_dir: ".copilot/skills"
capabilities: [agents, skills, user-install, version-detection]

# Detecção e escopo user usados por `sdd doctor --scope user`.
detection:
  commands: ["copilot"]
  version_args: ["--version"]
  user_profile: ".copilot"
  scopes: ["user"]

# Frontmatter injetado em cada agente gerado. A lista efetiva de tools é
# derivada da declaração `capabilities` do frontmatter fonte; capabilities
# ausentes fazem o build falhar.
frontmatter:
  mode: agent
  author: "{author}"
  description: "{description}"
  model: "Claude Sonnet 4.6"
  tools:
    - search/fileSearch
    - search/textSearch
    - edit/editFiles
    - edit/createFile
    - execute/runInTerminal
    - execute/getTerminalOutput
    - vscode/askQuestions

# Seções condicionais incluídas neste runtime
include_sections:
  - "@all"
  - "@copilot"

# Seções excluídas neste runtime
exclude_sections:
  - "@claude"

# Notas de comportamento para este runtime
notes:
  - "Copilot não tem Agent tool — paralelismo não disponível; tests + review rodam em sequência"
  - "Terminal disponível via execute/runInTerminal — G3 pode ser validado com execução real"
  - "Assets SDD são instalados no perfil user; a ativação não escreve no projeto consumidor"
